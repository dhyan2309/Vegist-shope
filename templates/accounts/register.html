{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account - Vegist Organic Supermarket{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 6rem; max-width: 520px;">
  <div style="background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--shadow-sm);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="logo-icon-box" style="margin: 0 auto 1rem; width: 52px; height: 52px; font-size: 1.8rem;">
        <i class="ri-leaf-fill"></i>
      </div>
      <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem;">Join Vegist Organic</h1>
      <p style="font-size: 0.9rem; color: var(--gray-500);">Get 15% off your first farm order and member perks</p>
    </div>

    <form action="{% url 'accounts:register' %}" method="POST">
      {% csrf_token %}

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.35rem; color: var(--dark);">First Name</label>
          <input type="text" name="first_name" required placeholder="Emma" style="width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem;">
        </div>
        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.35rem; color: var(--dark);">Last Name</label>
          <input type="text" name="last_name" required placeholder="Watson" style="width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem;">
        </div>
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.35rem; color: var(--dark);">Email Address *</label>
        <input type="email" name="email" required placeholder="you@example.com" style="width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.35rem; color: var(--dark);">Password *</label>
        <input type="password" name="password" required placeholder="Minimum 6 characters" style="width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.35rem; color: var(--dark);">Confirm Password *</label>
        <input type="password" name="password2" required placeholder="Re-enter password" style="width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-bottom: 1.25rem;">
        Create Account & Claim 15% Off
      </button>

      <div style="text-align: center; font-size: 0.9rem; color: var(--gray-600);">
        Already have an account? 
        <a href="{% url 'accounts:login' %}" style="color: var(--primary); font-weight: 700;">Sign In</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
